name: jaal
description: Bina internet ka mesh messenger - chat, files, voice messages, voice/video calls.
publish_to: none
version: 3.0.0
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  nearby_connections: '>=4.0.0 <5.0.0'
  nsd: '>=3.0.0 <5.0.0'
  flutter_webrtc: '>=0.11.0 <2.0.0'
  record: '>=5.1.0 <7.0.0'
  audioplayers: '>=6.0.0 <7.0.0'
  permission_handler: '>=11.0.0 <13.0.0'
  file_picker: '>=8.0.0 <11.0.0'
  path_provider: ^2.1.0
  shared_preferences: '>=2.2.0 <3.0.0'
  wakelock_plus: '>=1.2.0 <2.0.0'
flutter:
  uses-material-design: true
